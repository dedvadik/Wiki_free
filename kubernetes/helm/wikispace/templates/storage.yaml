{{/* БЛОК «storage» — общий том загруженных файлов для ВСЕХ копий web.
     ReadWriteMany: копия на одном узле загрузила видео — копия на другом
     узле его отдаёт. helm.sh/resource-policy: keep — том с файлами не
     удаляется даже при helm uninstall (удаляйте вручную, если нужно). */}}
{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "wikispace.fullname" . }}-uploads
  labels:
    {{- include "wikispace.labels" . | nindent 4 }}
    app.kubernetes.io/component: storage
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [{{ .Values.persistence.accessMode }}]
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
