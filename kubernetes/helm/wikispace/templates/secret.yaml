{{/* ===========================================================================
  Secret приложения: секрет подписи cookie (SESSION_SECRET) и пароль первого
  администратора. SESSION_SECRET ОБЯЗАН быть одинаковым у всех копий web —
  иначе сессия, созданная одной копией, не открылась бы на другой.
  Значения генерируются один раз и сохраняются при helm upgrade (lookup
  читает уже созданный Secret), поэтому обновление не разлогинивает людей.
=========================================================================== */}}
{{- if not .Values.app.existingSecret }}
{{- $name := include "wikispace.secret" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $session := "" }}
{{- $admin := .Values.app.adminPassword }}
{{- if $existing }}
{{- $session = index $existing.data "SESSION_SECRET" | default "" | b64dec }}
{{- if not $admin }}{{- $admin = index $existing.data "ADMIN_PASSWORD" | default "" | b64dec }}{{- end }}
{{- end }}
{{- if not $session }}{{- $session = randAlphaNum 64 }}{{- end }}
{{- if not $admin }}{{- $admin = randAlphaNum 16 }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "wikispace.labels" . | nindent 4 }}
type: Opaque
stringData:
  SESSION_SECRET: {{ $session | quote }}
  ADMIN_PASSWORD: {{ $admin | quote }}
{{- end }}
{{- if eq .Values.postgresql.mode "simple" }}
---
{{/* Учётная запись PostgreSQL для режима simple (у CloudNativePG — свой Secret). */}}
{{- $dbName := printf "%s-auth" (include "wikispace.db" .) }}
{{- $dbExisting := lookup "v1" "Secret" .Release.Namespace $dbName }}
{{- $dbPassword := "" }}
{{- if $dbExisting }}{{- $dbPassword = index $dbExisting.data "password" | default "" | b64dec }}{{- end }}
{{- if not $dbPassword }}{{- $dbPassword = randAlphaNum 32 }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $dbName }}
  labels:
    {{- include "wikispace.labels" . | nindent 4 }}
type: kubernetes.io/basic-auth
stringData:
  username: {{ .Values.postgresql.username | quote }}
  password: {{ $dbPassword | quote }}
{{- end }}
