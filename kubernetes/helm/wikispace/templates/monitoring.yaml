{{/* ServiceMonitor (Prometheus Operator) — сбор метрик web с порта metrics.
     VerticalPodAutoscaler в режиме рекомендаций (updateMode: Off): смотрит
     на реальное потребление копий и подсказывает requests
     (kubectl describe vpa …), ничего не меняя сам — HPA и VPA по CPU
     одновременно в режиме Auto конфликтовали бы. */}}
{{- if and .Values.serviceMonitor.enabled .Values.web.metrics.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "wikispace.web" . }}
  labels:
    {{- include "wikispace.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}{{ toYaml . | nindent 4 }}{{- end }}
spec:
  selector:
    matchLabels:
      {{- include "wikispace.webSelector" . | nindent 6 }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
{{- end }}
{{- if .Values.vpa.enabled }}
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ include "wikispace.web" . }}
  labels:
    {{- include "wikispace.labels" . | nindent 4 }}
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "wikispace.web" . }}
  updatePolicy:
    updateMode: "Off"
{{- end }}
