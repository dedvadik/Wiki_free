# =============================================================================
#  Helm-чарт WikiSpace — запуск портала в Kubernetes
# =============================================================================
#  Каждый блок портала — отдельный независимый компонент со своими копиями,
#  проверками здоровья и правилами размещения по узлам кластера:
#    web        — приложение (Deployment, 2…20 копий, автомасштабирование HPA);
#    database   — PostgreSQL: кластер CloudNativePG (основной сервер + реплики
#                 с автоматическим переключением) или внешняя база;
#    pooler-rw  — PgBouncer перед основным сервером (соединения на запись);
#    pooler-ro  — PgBouncer перед репликами (поиск и отчёты);
#    storage    — общий том для загруженных файлов (ReadWriteMany).
#  Подробности и инструкция — kubernetes/README.md.
# =============================================================================
apiVersion: v2
name: wikispace
description: Self-hosted база знаний в стиле Confluence — отказоустойчивый запуск с автомасштабированием
type: application
version: 1.0.0
appVersion: "1.0.0"
kubeVersion: ">=1.25.0-0"
keywords: [wiki, confluence, knowledge-base]
