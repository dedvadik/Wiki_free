<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="WikiSpace">
  <!-- Стандартный логотип: страница на синей подложке. Подложка нужна, чтобы
       логотип был виден на шапке любого цвета (и тёмной, и белой).
       Замените логотип в «Настройках» или положите свой файл в
       custom/public/img/logo.svg — он перекроет этот. -->
  <rect width="64" height="64" rx="14" fill="#2684ff"/>
  <rect x="21" y="9" width="28" height="38" rx="5" fill="#ffffff" opacity=".45"/>
  <rect x="15" y="15" width="28" height="40" rx="5" fill="#ffffff"/>
  <rect x="21" y="24" width="16" height="4" rx="2" fill="#2684ff"/>
  <rect x="21" y="32" width="12" height="4" rx="2" fill="#2684ff" opacity=".7"/>
  <rect x="21" y="40" width="14" height="4" rx="2" fill="#2684ff" opacity=".5"/>
</svg>
